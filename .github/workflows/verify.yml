name: Verify

on:
  push:
  pull_request:

jobs:
  runtime-and-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Builds the runtime and editor, runs the full test suite in headless Chrome,
      # and checks fixtures, the runtime API report and size budget, and whitespace.
      - run: npm run verify
