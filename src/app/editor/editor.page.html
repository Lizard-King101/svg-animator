<div editorClipboard class="editor-root" suppressPointerMovesDuringPlayback (click)="editor.closeContextMenu()">
  <div class="storage-warning" *ngIf="projectService.savingWarning">{{ projectService.savingWarning }}</div>

  <app-editor-header />

  <!-- ── Body ── -->
  <div class="editor-body">

    <app-tool-palette />

    <!-- Canvas viewport -->
    <app-canvas-workspace #workspace class="view-port">
      <ng-container *ngIf="editor.selectedSVG">
        <svg #artwork="svgDisplay" display eyedropperSurface [referenceImage]="reference.display"></svg>
        <svg animationInspection [artwork]="artwork.nativeElement" [workspace]="workspace"></svg>
        <svg [style.visibility]="rigs.hidesArtworkHandles ? 'hidden' : null" editorOverlay [artwork]="artwork.nativeElement" [workspace]="workspace"></svg>
        <app-canvas-crop *ngIf="animation.mode == 'edit'" [artwork]="artwork.nativeElement" [workspace]="workspace" />
        <app-reference-overlay *ngIf="animation.mode == 'edit'" [artwork]="artwork.nativeElement" [workspace]="workspace" />
        <app-shape-building-controls [artwork]="artwork.nativeElement" [workspace]="workspace" />
        <app-bone-drawing-controls [artwork]="artwork.nativeElement" [workspace]="workspace" />
        <app-rig-overlay *ngIf="animation.mode == 'edit'" [artwork]="artwork.nativeElement" [workspace]="workspace" />
        <app-ik-target *ngIf="animation.mode == 'edit'" [artwork]="artwork.nativeElement" [workspace]="workspace" />
        <app-construction-controls [artwork]="artwork.nativeElement" [workspace]="workspace" />
        <!-- Keep measured rulers in the artwork view; nested embedded views run before SVG host bindings. -->
        <app-canvas-guides [enabled]="animation.mode == 'edit'" [canvas]="artwork.nativeElement" [workspace]="workspace" />
      </ng-container>
      <div class="canvas-empty" *ngIf="!editor.selectedSVG">
        <div class="empty-hint">
          <fa-icon icon="plus"></fa-icon>
          <span>Click <strong>New</strong> to start drawing</span>
        </div>
      </div>
    </app-canvas-workspace>

    <!-- Right attribute panel -->
    <app-editor-side-panel class="attribute-panel" *ngIf="animation.mode == 'edit'" />

  </div>

  <animation-timeline
    *ngIf="editor.selectedSVG && animation.mode == 'animate'"
    (animationChange)="handleTimelineChange()"></animation-timeline>

  <app-new-project-dialog />
  <app-export-dialog />
  <app-editor-context-menu />
  <app-eyedropper />

</div>
