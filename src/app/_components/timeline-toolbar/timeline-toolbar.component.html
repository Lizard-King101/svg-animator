<div class="timeline-toolbar">
  <button class="timeline-icon" (click)="timeline.animation.togglePlayback()" [title]="timeline.animation.playing ? 'Pause' : 'Play'">
    <fa-icon [icon]="timeline.animation.playing ? 'pause' : 'play'"></fa-icon>
  </button>
  <button class="timeline-icon" (click)="timeline.animation.stop()" title="Stop">
    <fa-icon icon="stop"></fa-icon>
  </button>
  <button class="timeline-icon" (click)="timeline.jumpToPose(-1)" [disabled]="timeline.adjacentPoseTime(-1) == null"
    title="Previous pose (Alt+Left): selected key channels, else selected artwork/bone branch, else scene/action" aria-label="Previous pose"><fa-icon icon="chevron-left"></fa-icon></button>
  <button class="timeline-icon" (click)="timeline.jumpToPose(1)" [disabled]="timeline.adjacentPoseTime(1) == null"
    title="Next pose (Alt+Right): selected key channels, else selected artwork/bone branch, else scene/action" aria-label="Next pose"><fa-icon icon="chevron-right"></fa-icon></button>
  <label class="timeline-field"><span>Preview</span>
    <select class="graph-track-select" aria-label="Preview speed" [ngModel]="timeline.animation.speed" (ngModelChange)="timeline.animation.setPreviewSpeed($event)">
      <option *ngFor="let speed of timeline.animation.previewSpeeds" [ngValue]="speed">{{speed}}×</option>
    </select>
  </label>
  <label class="timeline-field">
    <span>Time</span>
    <input class="timeline-current-time" type="number" min="0" step="0.01"
           [ngModel]="timeline.animation.currentTime"
           (ngModelChange)="timeline.animation.seek($event)" />
  </label>
  <label class="timeline-field">
    <span>Duration</span>
    <input type="number" min="0.1" step="0.1"
           [ngModel]="timeline.animation.duration"
           (ngModelChange)="timeline.setDuration($event)" />
  </label>
  <app-icon-button label="Loop" [icon]="loopIcon" [pressed]="timeline.animation.loop"
    tooltip="Loop playback · Repeat the work area"
    (activated)="timeline.setLoop(!timeline.animation.loop)" />
  <div class="timeline-toolbar-sep"></div>
  <button class="timeline-icon" (click)="timeline.zoomTimeline(-20)" title="Zoom out">
    <fa-icon icon="minus"></fa-icon>
  </button>
  <button class="timeline-icon" (click)="timeline.fitTimeline()" title="Fit duration">
    <fa-icon icon="arrows-left-right"></fa-icon>
  </button>
  <button class="timeline-icon" (click)="timeline.zoomTimeline(20)" title="Zoom in">
    <fa-icon icon="plus"></fa-icon>
  </button>
  <div class="timeline-toolbar-sep"></div>
  <div class="surface-switch" aria-label="Timeline surface">
    <button class="surface-button" [class.active]="timeline.surfaceMode == 'timeline'" [attr.aria-pressed]="timeline.surfaceMode == 'timeline'" (click)="timeline.toggleSurfaceMode('timeline')">Timeline</button>
    <button class="surface-button" [class.active]="timeline.surfaceMode == 'graph'" [attr.aria-pressed]="timeline.surfaceMode == 'graph'" (click)="timeline.toggleSurfaceMode('graph')">Graph</button>
  </div>
  <ng-container *ngIf="timeline.surfaceMode == 'graph'">
    <select class="graph-track-select" [ngModel]="timeline.selectedGraphProperty" (ngModelChange)="timeline.selectGraphProperty($event)" title="Speed graph property">
      @for (option of timeline.graphTrackOptions(); track option.property) {
        <option [ngValue]="option.property">{{ option.label }}</option>
      }
    </select>
    <button class="timeline-icon" (click)="timeline.fitSpeed()" title="Fit Speed">Fit</button>
    <button class="timeline-icon" (click)="timeline.zoomSpeed(1.25)" title="Zoom speed out"><fa-icon icon="minus"></fa-icon></button>
    <button class="timeline-icon" (click)="timeline.zoomSpeed(0.8)" title="Zoom speed in"><fa-icon icon="plus"></fa-icon></button>
    <ng-container *ngIf="timeline.activeGraphHandle">
      <span class="active-axis-badge" [attr.data-axis]="timeline.graphAxis(timeline.activeGraphHandle.track.property)">{{ timeline.activeHandleAxisLabel() }}</span>
      <label class="timeline-field graph-field"><span>Speed</span><input type="number" step="0.01" [ngModel]="timeline.activeHandleSpeed()" (blur)="commitHandle('speed', $event)" (keydown)="handleKey('speed', $event)" /></label>
      <label class="timeline-field graph-field"><span>Influence</span><input type="number" min="0" max="1" step="0.01" [ngModel]="timeline.activeHandleInfluence()" (blur)="commitHandle('influence', $event)" (keydown)="handleKey('influence', $event)" /></label>
      <button class="surface-button" [class.active]="timeline.activeHandleLinked()" (click)="timeline.relinkActiveHandle()">Link</button>
    </ng-container>
  </ng-container>
  <div class="timeline-toolbar-sep" *ngIf="timeline.selectedKeyframeIds.size"></div>
  <div class="easing-switch" title="Selected keyframe easing" *ngIf="timeline.selectedKeyframeIds.size">
    <button class="timeline-icon easing-button"
            *ngFor="let option of timeline.easingOptions"
            [disabled]="timeline.selectedKeyframeIds.size == 0"
            [ngClass]="{'active': timeline.selectedEasingType() == option.type}"
            (click)="timeline.setSelectedEasing(option.type)"
            [attr.aria-label]="option.label" [attr.aria-pressed]="timeline.selectedEasingType() == option.type"
            [title]="option.label">
      <fa-icon [icon]="option.icon"></fa-icon>
    </button>
  </div>
  <div class="timeline-toolbar-sep"></div>
  <app-animation-inspection-controls />
  <app-icon-button label="View options" [icon]="settingsIcon" [expanded]="panel === 'view'" controls="timeline-view-options"
    tooltip="View options · Time zoom and ghost spacing" (activated)="togglePanel('view', $event)" />
  <app-icon-button label="Loop tools" [icon]="linkIcon" [expanded]="panel === 'loop'" controls="timeline-loop-tools"
    tooltip="Loop tools · Link endpoint poses and match seam speed" (activated)="togglePanel('loop', $event)" />
</div>
<section *ngIf="panel === 'view'" id="timeline-view-options" class="timeline-options" aria-label="View options" (keydown.escape)="closePanel($event)">
  <label class="timeline-zoom-field"><span>Time zoom</span>
    <input aria-label="Time zoom" type="range" min="10" max="2000" step="10" [ngModel]="timeline.pixelsPerSecond" (ngModelChange)="timeline.setTimelineZoom($event)" />
    <output>{{timeline.pixelsPerSecond}} px/s</output>
  </label>
  <label class="timeline-field"><span>Ghost spacing (s)</span><input aria-label="Onion skin spacing in seconds" type="number"
    min="0.01" max="10" step="0.05" [ngModel]="inspection.step" (ngModelChange)="inspection.setStep($event)" /></label>
  <span class="ghost-legend"><i class="past"></i>Before <i class="future"></i>After</span>
  <button type="button" class="surface-button" (click)="closePanel($event)">Done</button>
</section>
<section *ngIf="panel === 'loop'" id="timeline-loop-tools" aria-label="Loop tools" (keydown.escape)="closePanel($event)">
  <app-loop-seam-controls />
</section>
<app-timeline-navigation />
