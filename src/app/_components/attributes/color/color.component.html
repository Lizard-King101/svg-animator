<label *ngIf="label">{{label}}</label>
<div class="inputs">
  <div class="hex-selector">
    <span class="color-swatch" [ngStyle]="{'background-color': color.serialized}"></span>
    <input type="text" [(ngModel)]="color.hex" (input)="updateHEX()" placeholder="#000000">
    <select [(ngModel)]="editType">
      <option value="hsl">HSL</option>
      <option value="rgbs">RGB</option>
    </select>
  </div>

  <button *ngIf="eyedropper" type="button" class="btn btn-sm btn-secondary eyedropper-button" [disabled]="!eyedropper.available"
    aria-label="Pick color from artwork or reference" title="Eyedropper · sample artwork or the original reference image" (click)="pickColor($event)">Eyedropper</button>

  <div class="rgb" *ngIf="editType == 'rgbs'">
    <label class="channel" title="Red"><span aria-hidden="true">R</span><input class="range slider" type="range" aria-label="Red" [(ngModel)]="rgb.r" [min]="0" [max]="255" (input)="updateRGB()"></label>
    <label class="channel" title="Green"><span aria-hidden="true">G</span><input class="range slider" type="range" aria-label="Green" [(ngModel)]="rgb.g" [min]="0" [max]="255" (input)="updateRGB()"></label>
    <label class="channel" title="Blue"><span aria-hidden="true">B</span><input class="range slider" type="range" aria-label="Blue" [(ngModel)]="rgb.b" [min]="0" [max]="255" (input)="updateRGB()"></label>
  </div>

  <div class="hsl" *ngIf="editType == 'hsl'">
    <label class="channel" title="Hue"><span aria-hidden="true">H</span><input class="range slider" type="range" aria-label="Hue" [(ngModel)]="hsl.h" [min]="0" [max]="360" (input)="updateHSL()"></label>
    <label class="channel" title="Saturation"><span aria-hidden="true">S</span><input class="range slider" type="range" aria-label="Saturation" [(ngModel)]="hsl.s" [min]="0" [max]="100" (input)="updateHSL()"></label>
    <label class="channel" title="Lightness"><span aria-hidden="true">L</span><input class="range slider" type="range" aria-label="Lightness" [(ngModel)]="hsl.l" [min]="0" [max]="100" (input)="updateHSL()"></label>
  </div>
  <label class="channel" title="Opacity">
    <span aria-hidden="true">A</span>
    <input class="range slider" type="range" aria-label="Opacity" [(ngModel)]="color.alpha" [min]="0" [max]="1" [step]="0.01" (input)="updateAlpha()">
    <output>{{ (color.alpha * 100).toFixed(0) }}%</output>
  </label>
</div>
