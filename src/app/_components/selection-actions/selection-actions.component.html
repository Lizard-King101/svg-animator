<div class="arrangement" role="group" aria-label="Arrange selection">
  <label class="reference" title="Align geometric bounds; excludes strokes and effects">
    <span>Align to</span>
    <select aria-label="Alignment reference" [ngModel]="arrangement.effectiveReference" (ngModelChange)="arrangement.reference = $event" [disabled]="arrangement.count < 2">
      <option value="selection">Selection</option>
      <option value="canvas">Canvas</option>
      <option value="last">Last selected</option>
    </select>
  </label>
  <div class="buttons" aria-label="Align objects">
    <button type="button" *ngFor="let item of alignments" [disabled]="!arrangement.available"
            [attr.aria-label]="item.label" [title]="item.label" (click)="arrangement.align(item.action)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path class="guide" [attr.d]="item.guide" /><path class="shapes" [attr.d]="item.shapes" /></svg>
    </button>
  </div>
  <div class="buttons" aria-label="Equal gaps within selection">
    <button type="button" *ngFor="let item of distributions" [disabled]="!arrangement.available || arrangement.count < 3"
            [attr.aria-label]="item.label" [title]="item.label + ' (3+ objects; outer objects stay fixed)'" (click)="arrangement.distribute(item.axis)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path class="shapes" [attr.d]="item.shapes" /></svg>
    </button>
  </div>
  <fa-icon *ngIf="!arrangement.available" class="hint" icon="circle-info" role="img"
           [attr.aria-label]="unavailableHint" [title]="unavailableHint"></fa-icon>
</div>
